name: Deploy to Cloudflare Pages

# labs.matchstick.trading is a direct-upload Pages project; this uploads plays/ on every push
# to main. plays/ is the whole site, with no build step.

on:
  push:
    branches: [main]
    paths: ["plays/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy plays --project-name=matchstick-labs --branch=main --commit-dirty=true
